<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aufgaben" />
    <link rel="apple-touch-icon" href="../build/icon.png" />
    <title>Aufgabenplaner</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6fb;
        --surface: #ffffff;
        --text: #1c1d2b;
        --text-muted: #6b6e85;
        --border: #e3e4ee;
        --accent: #4f46e5;
        --accent-contrast: #ffffff;
        --done: #9ca0b5;
        --danger: #d64545;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15161f;
          --surface: #1e202c;
          --text: #eceefb;
          --text-muted: #9799ad;
          --border: #2c2e3d;
          --accent: #7c73f0;
          --accent-contrast: #14152080;
          --done: #6a6c80;
          --danger: #ef6a6a;
        }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        padding-bottom: env(safe-area-inset-bottom);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 5;
        border-bottom: 1px solid var(--border);
      }
      header h1 { font-size: 17px; margin: 0; }
      .icon-btn {
        border: none;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        width: 36px;
        height: 36px;
        font-size: 15px;
        cursor: pointer;
      }
      main { padding: 12px 16px 32px; }
      .section { margin-bottom: 22px; }
      .section-header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 4px 0 8px;
      }
      .section-header h2 {
        font-size: 12.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
        margin: 0;
      }
      .count {
        font-size: 11px;
        color: var(--text-muted);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .add-form { margin-bottom: 8px; }
      .add-form input {
        width: 100%;
        padding: 11px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 15px;
      }
      .task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .task-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .task-item input[type='checkbox'] { margin-top: 3px; width: 18px; height: 18px; flex-shrink: 0; }
      .task-body { flex: 1; min-width: 0; }
      .task-title { font-size: 15px; outline: none; word-break: break-word; }
      .task-item.done .task-title { text-decoration: line-through; color: var(--done); }
      .task-description {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 3px;
        word-break: break-word;
        outline: none;
        min-height: 1.1em;
      }
      .task-description.empty { font-style: italic; opacity: 0.6; }
      .task-description.empty::before { content: attr(data-placeholder); }
      .task-delete {
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 16px;
        padding: 4px 6px;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .badge {
        display: inline-block;
        font-size: 10px;
        color: var(--text-muted);
        background: var(--bg);
        border-radius: 999px;
        padding: 1px 7px;
        margin-top: 5px;
      }
      .step-list { margin-top: 6px; }
      .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
      .step { display: flex; align-items: flex-start; gap: 6px; padding: 4px 6px; border-radius: 8px; border-left: 2px solid transparent; font-size: 13px; }
      .step.next { border-left-color: var(--accent); background: rgba(79, 70, 229, 0.08); }
      .step.done .step-text { text-decoration: line-through; color: var(--done); }
      .step input[type='checkbox'] { margin-top: 2px; width: 16px; height: 16px; flex-shrink: 0; }
      .step-text { flex: 1; outline: none; word-break: break-word; }
      .step-delete { border: none; background: transparent; color: var(--text-muted); font-size: 13px; padding: 2px 6px; }
      .add-step-form { margin-top: 4px; }
      .add-step-form input {
        width: 100%;
        padding: 7px 9px;
        border-radius: 8px;
        border: 1px dashed var(--border);
        background: transparent;
        color: var(--text);
        font-size: 13px;
      }
      .empty-state { color: var(--text-muted); font-size: 13px; padding: 4px 2px; }
      .hint { text-align: center; color: var(--text-muted); font-size: 12.5px; padding: 8px 16px; }

      dialog#settingsDialog {
        border: none;
        border-radius: 16px;
        padding: 0;
        width: min(92vw, 420px);
        color: var(--text);
        background: var(--surface);
      }
      dialog#settingsDialog::backdrop { background: rgba(0, 0, 0, 0.5); }
      .settings-body { padding: 18px; }
      .settings-body h2 { font-size: 16px; margin: 0 0 4px; }
      .settings-body p.help { font-size: 12px; color: var(--text-muted); margin: 4px 0 12px; line-height: 1.4; }
      .settings-body label { display: block; font-size: 11.5px; color: var(--text-muted); margin: 10px 0 3px; }
      .settings-body input {
        width: 100%;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      .settings-actions { display: flex; gap: 8px; margin-top: 16px; }
      .btn {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 9px;
        padding: 10px 14px;
        font-size: 13.5px;
        font-weight: 500;
        flex: 1;
      }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1>Aufgabenplaner</h1>
      <button id="settingsBtn" class="icon-btn" title="Einstellungen">⚙</button>
    </header>

    <main>
      <section class="section">
        <div class="section-header">
          <h2>Heute</h2>
          <span class="count" id="countToday">0</span>
        </div>
        <form class="add-form" data-category="today">
          <input type="text" placeholder="Neue Aufgabe fuer heute..." maxlength="200" required />
        </form>
        <ul class="task-list" id="listToday"></ul>
      </section>

      <section class="section">
        <div class="section-header">
          <h2>Prozesse &amp; Optimierungen</h2>
          <span class="count" id="countProcess">0</span>
        </div>
        <form class="add-form" data-category="process">
          <input type="text" placeholder="Neue Prozess-/Optimierungsidee..." maxlength="200" required />
        </form>
        <ul class="task-list" id="listProcess"></ul>
      </section>

      <p class="hint" id="hint"></p>
    </main>

    <dialog id="settingsDialog">
      <form class="settings-body" id="settingsForm">
        <h2>Supabase verbinden</h2>
        <p class="help">
          Dieselben Zugangsdaten wie in der Desktop-App (Einstellungen &rarr;
          Projekt-URL &amp; Anon Public Key). Sie werden nur auf diesem Gerät
          im Browser gespeichert.
        </p>
        <label for="urlInput">Projekt-URL</label>
        <input id="urlInput" type="text" placeholder="https://xxxx.supabase.co" required />
        <label for="keyInput">Anon Public Key</label>
        <input id="keyInput" type="password" placeholder="eyJhbGciOi..." required />
        <div class="settings-actions">
          <button type="submit" class="btn btn-primary">Speichern</button>
          <button type="button" id="settingsCancelBtn" class="btn">Abbrechen</button>
        </div>
      </form>
    </dialog>

    <script>
      const STORAGE_KEY = 'aufgabenplaner.supabase';

      const listToday = document.getElementById('listToday');
      const listProcess = document.getElementById('listProcess');
      const countToday = document.getElementById('countToday');
      const countProcess = document.getElementById('countProcess');
      const hint = document.getElementById('hint');
      const settingsDialog = document.getElementById('settingsDialog');
      const settingsForm = document.getElementById('settingsForm');
      const urlInput = document.getElementById('urlInput');
      const keyInput = document.getElementById('keyInput');

      let tasks = [];
      let config = null;

      function loadConfig() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }

      function saveConfig(next) {
        config = next;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      }

      function openSettings() {
        urlInput.value = config?.url || '';
        keyInput.value = config?.key || '';
        settingsDialog.showModal();
      }

      document.getElementById('settingsBtn').addEventListener('click', openSettings);
      document.getElementById('settingsCancelBtn').addEventListener('click', () => settingsDialog.close());

      settingsForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const url = urlInput.value.trim().replace(/\/$/, '');
        const key = keyInput.value.trim();
        if (!url || !key) return;
        saveConfig({ url, key });
        settingsDialog.close();
        loadTasks();
      });

      function restUrl(pathAndQuery) {
        return `${config.url}/rest/v1/${pathAndQuery}`;
      }

      function restHeaders(prefer) {
        const headers = {
          apikey: config.key,
          Authorization: `Bearer ${config.key}`,
          'Content-Type': 'application/json',
        };
        if (prefer) headers.Prefer = prefer;
        return headers;
      }

      async function apiRequest(method, pathAndQuery, body, prefer) {
        const res = await fetch(restUrl(pathAndQuery), {
          method,
          headers: restHeaders(prefer),
          body: body !== undefined ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) {
          const text = await res.text().catch(() => '');
          throw new Error(`Supabase ${method} fehlgeschlagen (${res.status}): ${text}`);
        }
        if (res.status === 204) return null;
        const text = await res.text();
        return text ? JSON.parse(text) : null;
      }

      function renderColumn(listEl, countEl, category) {
        const items = tasks
          .filter((t) => t.category === category)
          .sort((a, b) => {
            if (a.status !== b.status) return a.status === 'done' ? 1 : -1;
            return new Date(a.created_at) - new Date(b.created_at);
          });

        countEl.textContent = String(items.length);
        listEl.innerHTML = '';

        if (!items.length) {
          const empty = document.createElement('li');
          empty.className = 'empty-state';
          empty.textContent = 'Noch keine Aufgaben hier.';
          listEl.appendChild(empty);
          return;
        }
        for (const task of items) listEl.appendChild(renderTaskItem(task));
      }

      function renderDescription(task) {
        const desc = document.createElement('div');
        desc.className = 'task-description';
        desc.contentEditable = 'true';
        desc.textContent = task.description || '';
        desc.dataset.placeholder = 'Notiz hinzufuegen...';
        desc.classList.toggle('empty', !task.description);
        desc.addEventListener('focus', () => desc.classList.remove('empty'));
        desc.addEventListener('blur', () => {
          const text = desc.textContent.trim();
          desc.classList.toggle('empty', !text);
          if (text !== (task.description || '')) updateTask(task.id, { description: text });
          else desc.textContent = task.description || '';
        });
        return desc;
      }

      function renderStepList(task) {
        const steps = Array.isArray(task.steps) ? task.steps : [];
        let nextMarked = false;

        const wrap = document.createElement('div');
        wrap.className = 'step-list';
        const ul = document.createElement('ul');
        ul.className = 'steps';

        for (const step of steps) {
          const li = document.createElement('li');
          li.className = 'step' + (step.done ? ' done' : '');
          if (!step.done && !nextMarked) {
            li.classList.add('next');
            nextMarked = true;
          }

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = !!step.done;
          checkbox.addEventListener('change', () => {
            const updated = steps.map((s) => (s.id === step.id ? { ...s, done: checkbox.checked } : s));
            updateTask(task.id, { steps: updated });
          });

          const text = document.createElement('span');
          text.className = 'step-text';
          text.contentEditable = 'true';
          text.textContent = step.text;
          text.addEventListener('blur', () => {
            const value = text.textContent.trim();
            if (value && value !== step.text) {
              const updated = steps.map((s) => (s.id === step.id ? { ...s, text: value } : s));
              updateTask(task.id, { steps: updated });
            } else {
              text.textContent = step.text;
            }
          });

          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'step-delete';
          del.textContent = '×';
          del.addEventListener('click', () => {
            const updated = steps.filter((s) => s.id !== step.id);
            updateTask(task.id, { steps: updated });
          });

          li.appendChild(checkbox);
          li.appendChild(text);
          li.appendChild(del);
          ul.appendChild(li);
        }
        wrap.appendChild(ul);

        const form = document.createElement('form');
        form.className = 'add-step-form';
        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 200;
        input.placeholder = '+ Schritt hinzufuegen';
        form.appendChild(input);
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const value = input.value.trim();
          if (!value) return;
          const updated = [...steps, { id: `s${Date.now()}`, text: value, done: false }];
          updateTask(task.id, { steps: updated });
          input.value = '';
        });
        wrap.appendChild(form);

        return wrap;
      }

      function renderTaskItem(task) {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.status === 'done' ? ' done' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.status === 'done';
        checkbox.addEventListener('change', () => {
          updateTask(task.id, { status: checkbox.checked ? 'done' : 'open' });
        });

        const body = document.createElement('div');
        body.className = 'task-body';

        const title = document.createElement('div');
        title.className = 'task-title';
        title.contentEditable = 'true';
        title.textContent = task.title;
        title.addEventListener('blur', () => {
          const newTitle = title.textContent.trim();
          if (newTitle && newTitle !== task.title) updateTask(task.id, { title: newTitle });
          else title.textContent = task.title;
        });
        body.appendChild(title);
        body.appendChild(renderDescription(task));

        if (task.category === 'process') body.appendChild(renderStepList(task));

        if (task.source === 'screenshot') {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = '📸 per Screenshot erkannt';
          body.appendChild(badge);
        }

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'task-delete';
        deleteBtn.textContent = '✕';
        deleteBtn.addEventListener('click', () => removeTask(task.id));

        li.appendChild(checkbox);
        li.appendChild(body);
        li.appendChild(deleteBtn);
        return li;
      }

      function renderAll() {
        renderColumn(listToday, countToday, 'today');
        renderColumn(listProcess, countProcess, 'process');
      }

      async function loadTasks() {
        if (!config) return;
        hint.textContent = 'Lade Aufgaben...';
        try {
          tasks = await apiRequest('GET', 'tasks?select=*&order=created_at.asc');
          hint.textContent = '';
          renderAll();
        } catch (err) {
          hint.textContent = `Fehler beim Laden: ${err.message || err}`;
        }
      }

      async function addTask(category, title) {
        const optimistic = {
          id: `tmp-${Date.now()}`,
          title,
          description: '',
          category,
          status: 'open',
          source: 'manual',
          steps: [],
          created_at: new Date().toISOString(),
        };
        tasks.push(optimistic);
        renderAll();
        try {
          const payload = { title, description: '', category, status: 'open', source: 'manual', steps: [] };
          const result = await apiRequest('POST', 'tasks', payload, 'return=representation');
          const created = Array.isArray(result) ? result[0] : result;
          tasks = tasks.map((t) => (t.id === optimistic.id ? created : t));
        } catch (err) {
          tasks = tasks.filter((t) => t.id !== optimistic.id);
          hint.textContent = `Fehler beim Speichern: ${err.message || err}`;
        }
        renderAll();
      }

      async function updateTask(id, patch) {
        const before = tasks.find((t) => t.id === id);
        tasks = tasks.map((t) => (t.id === id ? { ...t, ...patch } : t));
        renderAll();
        try {
          const result = await apiRequest('PATCH', `tasks?id=eq.${encodeURIComponent(id)}`, patch, 'return=representation');
          const updated = Array.isArray(result) ? result[0] : result;
          tasks = tasks.map((t) => (t.id === id ? updated : t));
          renderAll();
        } catch (err) {
          if (before) tasks = tasks.map((t) => (t.id === id ? before : t));
          renderAll();
          hint.textContent = `Fehler beim Speichern: ${err.message || err}`;
        }
      }

      async function removeTask(id) {
        const before = tasks;
        tasks = tasks.filter((t) => t.id !== id);
        renderAll();
        try {
          await apiRequest('DELETE', `tasks?id=eq.${encodeURIComponent(id)}`);
        } catch (err) {
          tasks = before;
          renderAll();
          hint.textContent = `Fehler beim Loeschen: ${err.message || err}`;
        }
      }

      document.querySelectorAll('.add-form').forEach((form) => {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const input = form.querySelector('input');
          const value = input.value.trim();
          if (!value) return;
          addTask(form.dataset.category, value);
          input.value = '';
        });
      });

      window.addEventListener('focus', () => loadTasks());

      config = loadConfig();
      if (!config) {
        openSettings();
      } else {
        loadTasks();
      }
    </script>
  </body>
</html>
